name: Keep Backend Warm

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    name: Ping Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -f https://serveiq-backend-g6wa.onrender.com/health || true
