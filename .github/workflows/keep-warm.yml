name: Keep Backend Warm

on:
  schedule:
    - cron: '*/15 * * * *'

  push:
    branches: [main]

  workflow_dispatch:

jobs:
  ping:
    name: Ping Backend
    runs-on: ubuntu-latest

    steps:
      - name: Wait for backend to spin up
        run: sleep 15

      - name: Ping health endpoint
        run: |
          curl -f \
            --retry 3 \
            --retry-delay 10 \
            --max-time 60 \
            https://serveiq-backend-g6wa.onrender.com/health
