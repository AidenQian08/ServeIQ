name: Keep Backend Warm

on:
  schedule:
    - cron: '0 * * * *'  # Every hour (more reliable than 15-min)
  push:
    branches: [main]  # Also run on push to keep schedule "active"
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    name: Ping Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -f https://serveiq-backend-g6wa.onrender.com/health || true
